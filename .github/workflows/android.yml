
name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 配置 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 编译 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. 上传 APK，供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

